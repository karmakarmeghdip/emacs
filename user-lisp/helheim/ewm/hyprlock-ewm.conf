# EWM-only lock screen, explicitly selected by helheim-ewm-power.
# No hyprctl, screenshot protocol or idle daemon dependencies.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(242424)
}

label {
    monitor =
    text = $TIME
    font_family = Sans
    font_size = 90
    color = rgb(ffffff)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = Sans
    font_size = 22
    color = rgb(deddda)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = Sans
    font_size = 20
    color = rgb(ffffff)
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12
    inner_color = rgb(3d3d3d)
    outer_color = rgb(77767b)
    check_color = rgb(3584e4)
    fail_color = rgb(e01b24)
    font_color = rgb(ffffff)
    font_family = Sans
    placeholder_text = Password
    fail_text = Authentication failed
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -105
    halign = center
    valign = center
}
